# Redmi K20 / Mi 9T (SM7150); the port itself is documented in docs/DAVINCI.md.
NAME="Redmi K20 / Mi 9T (davinci)"
KIND=phone
SOC="Qualcomm Snapdragon 730 (SM7150)"
# The name the loader knows this phone by (xnuloader/loader.c, platform_davinci): it goes on the
# kernel command line as platform=davinci, so the loader needs no framebuffer address to tell.
PLATFORM=davinci
UEFI_TARGET=davinci
UEFI_FD=${UEFI_FD:-}
DTB=out/davinci/davinci.dtb
# Where the BootShim puts the UEFI image, and exactly how big the .fd is (mkxnuimg.py refuses one of
# another size). Both numbers are the ones davinci's own Mu-Silicium port builds with --
# Resources/Configs/davinci.conf there: TARGET_FD_BASE / TARGET_FD_SIZE, 0x300 blocks of 0x1000 in
# Platforms/Xiaomi/davinciPkg/davinci.fdf. They are the same two numbers raphael uses because the
# window XBL leaves free for the firmware is the same on these SoCs: the value comes from davinci's
# build, not from raphael. `./xl memmap` re-reads the map from the running firmware and is where a
# disagreement would show.
FD_BASE=0x9FC00000
FD_SIZE=0x00300000
PAYLOAD_BASE=0xF0000000
# The panel's splash the bootloader leaves: cont_splash_region@9c000000 in this phone's own tree
# (0x1700000 bytes), and the address the earlier davinci project drew through. The loader reads the
# real one from UEFI on every boot; this is the value to expect, and the same address raphael's
# panel sits at, which is why the loader must be told the phone by name instead of by address.
FB_BASE=0x9c000000
WIFI_ATH11K=0
WIFI_ATH10K=1
# From davinci's own device tree (tools/fdt-facts.py, qcom,sdmmagpie): the virtual timer is PPI 3,
# so gic_timer_irq is 19 -- raphael's number, not redwood's 27. The earlier davinci project carries
# the same constant (VTIMER_INTID 19).
BOOTARGS="gic_timer_irq=19 cpus=8 touchscreen=1 buttons=1 cpufreq=1 gpu=1 fb_scan=1 wifi=0 modem=0 adsp=0 ufs=0 ufs_write=0"
DEFAULT_SECS=300
USERLAND_VARS="GL=1 REST=1 QUIET=1 OSLOG= RC=$ROOT/userland/rc.launchd RC_JOBS=$ROOT/devices/davinci/davinci.jobs"
FIRMWARE=""
